[build-system]
requires = ["uv-build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[project]
name = "otakudb"
version = "0.3.0"
dependencies = [
	"questionary",
	"dulwich>=1.2.6",
	"dublib>=0.32.0"
]

[project.optional-dependencies]
dev = ["ruff", "ty", "typos"]

[project.scripts]
otakudb = "otakudb:main"

[tool.ruff.lint]
select = ["A", "ARG", "C", "COM", "E", "F", "I", "N818", "W"]
ignore = ["E701", "E501", "W191"]

[tool.ruff.lint.isort]
lines-after-imports = 1
sections = {"dublib" = ["dublib"], otakudb = ["otakudb"]}
section-order = [
	"future",
	"standard-library",
	"third-party",
	"dublib",
	"otakudb",
	"first-party",
	"local-folder"
]